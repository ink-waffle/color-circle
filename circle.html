<!DOCTYPE html>
<html>
    <body>

    <div id="myCanvas"></div>

    <script>

    var c = document.getElementById("myCanvas");

    fetch("circle.bf").then(function(response) {
        return response.text();
    }).then(function(program) {
        var frames = Brainfuck(program);
        frames.next();

        setInterval(function(){
            c.innerHTML = frames.next(1).value;
        }, 16);
    });

    // Runs a Brainfuck program on an 8-bit tape and hands back its output whenever it reads a byte
    function* Brainfuck(program) {
        var code = program.replace(/[^+\-<>[\].,]/g, "");
        var jumps = [];
        var open = [];

        for(var i = 0; i < code.length; i++) {
            if (code[i] == "[") {
                open.push(i);
            } else if (code[i] == "]") {
                var j = open.pop();
                jumps[i] = j;
                jumps[j] = i;
            }
        }

        var tape = new Uint8Array(30000);
        var ptr = 0;
        var output = "";

        for(var pc = 0; pc < code.length; pc++) {
            switch (code[pc]) {
                case "+": tape[ptr]++; break;
                case "-": tape[ptr]--; break;
                case ">": ptr++; break;
                case "<": ptr--; break;
                case ".": output += String.fromCharCode(tape[ptr]); break;
                case ",": tape[ptr] = yield output; output = ""; break;
                case "[": if (!tape[ptr]) pc = jumps[pc]; break;
                case "]": if (tape[ptr]) pc = jumps[pc]; break;
            }
        }
        return output;
    }

    </script> 

    </body>
</html>
